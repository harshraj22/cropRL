[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "crop-env"
version = "0.1.0"
description = "CropRL: Farm Management RL Environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core",
    "numpy>=1.24",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
